storage: /verdaccio/storage

web:
  enable: true
  title: Offline Dev Vault Registry
  darkMode: true
  login: false
  pkgManagers:
    - npm
    - pnpm
    - yarn

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true
    maxage: 2m
    timeout: 60s
    fail_timeout: 2m
    max_fails: 2

packages:
  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

publish:
  allow_offline: true

middlewares:
  audit:
    enabled: true

log: { type: stdout, format: pretty, level: http }
